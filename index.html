    <meta charset="UTF-8">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appBg: '#03120e',
                        panelBg: '#232A5B',
                        neonBlue: '#454ADE',
                        accent: '#a7f3d0'
                    }
                }
            }
        }
    </script>

        body { background-color: #03120e; color: #ffffff; }
        
        .neon-panel { 
            background-color: #232A5B; 
            border: 2px solid #454ADE;
            border-radius: 1rem;
            box-shadow: 0 0 15px rgba(69, 74, 222, 0.5), inset 0 0 10px rgba(69, 74, 222, 0.3);
        }
        
        .inner-box { 
            background-color: rgba(0, 0, 0, 0.3); 
            border: 1px solid rgba(69, 74, 222, 0.4); 
            transition: all 0.3s ease;
        }
        .inner-box:hover, .inner-box:focus-within {
            border-color: #454ADE;
            box-shadow: 0 0 8px rgba(69, 74, 222, 0.6);
        }

            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(69, 74, 222, 0.3);
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .input-dark:focus { border-color: #454ADE; }
        .input-dark option { background-color: #121633; color: #ffffff; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0, 0.2); }
        ::-webkit-scrollbar-thumb { background: #454ADE; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5c60f5; }

        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        input[type="date"] {
            -webkit-appearance: none;
            appearance: none;
            text-align: left;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.8;
            cursor: pointer;
        }

        @keyframes zoomInApp {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-zoom-in {
            animation: zoomInApp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .category-card:hover:not(.disabled-card) {

            box-shadow: 0 10px 25px rgba(69, 74, 222, 0.4);
            border-color: #a7f3d0;
        }

            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

            border-color: #a7f3d0 !important;
            background-color: rgba(167, 243, 208, 0.12) !important;
            box-shadow: 0 0 20px rgba(167, 243, 208, 0.4) !important;
            transform: scale(1.01);

            position: fixed;
            top: 0;
            left: 0;
            z-index: -100;
            opacity: 0.01;
            pointer-events: none;
        }

    <!-- 1. PANTALLA DE LOGIN -->
    <div id="login-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#03120e]">
        <div class="neon-panel p-8 w-full max-w-sm flex flex-col items-center">

                    <span>Entrar al Sistema</span>

                </div>

            </div>

                    <svg class="w-4 h-4 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>

                    Log Out
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-6">
            <div onclick="showHub(true)" class="neon-panel p-8 category-card cursor-pointer flex flex-col items-center text-center group bg-gradient-to-b from-[#232A5B] to-[#121633]">
                <div class="w-20 h-20 rounded-2xl bg-neonBlue/20 flex items-center justify-center mb-6 group-hover:bg-neonBlue/40 transition-colors border border-neonBlue/40">
                    <svg class="w-10 h-10 text-neonBlue group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11Aquí tienes el código completo actualizado con ambos ajustes implementados y sin afectar ninguno de los usuarios ni miembros del staff que ya tienes registrados en Firebase:

### ¿Qué se corrigió en esta versión?
1. **Vista de Inicio para Usuarios Normales (`user`):**
   * Al iniciar sesión con un usuario creado por ti, ahora entra directamente a la vista de **Datos del Proyecto y Categorías** (donde rellena *Empresa, Fecha, Plan, Tasa* y elige *Redes Sociales*).
   * Dentro del tabulador, el botón **"Volver al Menú"** está habilitado para ellos para que puedan regresar a cambiar los datos del cliente o elegir otra categoría, pero el botón **"Inicio"** (que lleva al Hub del CEO y a Pagos del Staff) permanece oculto.
2. **Corrección del PDF entrecortado en Modo Usuario:**
   * **Causa del corte:** Al ocultarse el Costo Neto y el cuadro de Distribución para el usuario común, la tarjeta del PDF quedaba más ancha (`450px`) que alta (`~260px`). Al forzar la orientación vertical (`portrait`), la librería `jsPDF` invertía automáticamente las medidas y cortaba el documento por la mitad.
   * **Solución:** Ahora el generador detecta automáticamente la proporción exacta del documento (`landscape` o `portrait` según la altura real), fija las dimensiones exactas en `html2canvas` y renderiza con opacidad completa fuera de pantalla para que el PDF salga **100% entero y nítido** tanto en modo CEO como en modo Usuario.
